name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash test/install.test.sh

  release:
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag and release
        run: |
          version="v$(jq -r .version package.json)"
          if gh release view "$version" --json tagName --jq .tagName &>/dev/null; then
            echo "Release $version already exists — skipping"
            exit 0
          fi
          # Extract notes from CHANGELOG.md for this version
          notes=$(awk -v ver="${version#v}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          gh release create "$version" \
            --title "ocmem $version" \
            --notes "$notes" \
            --target "${{ github.sha }}"
